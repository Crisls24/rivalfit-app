name: rivalfit
description: "RivalFit - App de ejercicio competitivo social con verificacion IA anti-trampas"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^18.0.0

  # Backend
  supabase_flutter: ^2.8.0

  # Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Utils
  video_player: ^2.14.0
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
    - assets/videos/Onboarding_1.mp4
    - assets/videos/Onboarding_2.mp4
    - assets/videos/Onboarding_3.mp4
    - assets/icons/

